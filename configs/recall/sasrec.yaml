# @package recall
name: sasrec
type: sequential

model:
  embedding_dim: 64
  max_seq_len: 50
  num_blocks: 2
  num_heads: 2
  dropout: 0.2
  layer_norm_eps: 1e-12
  device: cpu                     # {auto, cpu, cuda, mps}

train:
  epochs: 50
  batch_size: 128
  lr: 1e-3
  weight_decay: 0.0
  loss: bpr_per_position          # {bpr_per_position, sampled_softmax} (only bpr_per_position implemented)
  num_negatives: 1
  grad_clip: 5.0
  early_stopping_patience: 10     # reserved for future use
  inference_batch_size: 512

output:
  top_k: 300

eval:
  k_list: [10, 50, 100, 200]

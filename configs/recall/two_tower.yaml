# @package recall
name: two_tower
type: deep_retrieval

model:
  architecture: dssm              # {dssm, youtube_dnn}
  embedding_dim: 64
  user_tower_hidden: []           # [] = pure bilinear MF on (user_id ⊕ seq_mean)
  item_tower_hidden: []           # add e.g. [128, 64] to enable a deep tower
  activation: relu
  dropout: 0.0
  l2_reg: 1e-6
  temperature: 1.0                # kept for forward-compat (BPR loss ignores it)
  normalize: false                # L2-norm towers (off → magnitude is free)
  device: cpu                     # {auto, cpu, cuda, mps} — CPU is faster for ML-1M scale

train:
  epochs: 80
  batch_size: 2048
  lr: 1e-3
  weight_decay: 1e-5
  negative_sampling: bpr_uniform  # {bpr_uniform, in_batch, popularity, hard}
  num_negatives: 1                # BPR uses exactly 1 negative per positive
  early_stopping_patience: 5

output:
  top_k: 500
  index:
    type: hnsw                    # {flat, ivf, hnsw}
    hnsw_m: 32
    ef_construction: 200
    ef_search: 64

eval:
  k_list: [10, 50, 100, 200]

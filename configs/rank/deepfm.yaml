# @package rank
name: deepfm
stage: pre_rank

model:
  embedding_dim: 16
  dnn_hidden: [256, 128, 64]
  dnn_dropout: 0.3
  use_fm: true
  use_deep: true
  device: cpu

train:
  epochs: 8
  batch_size: 4096
  inference_batch_size: 16384
  lr: 1.0e-3
  weight_decay: 1.0e-5
  early_stopping_patience: 2

input:
  max_genres: 6
  max_seq_len: 50
  negative_ratio: 4
  hard_negative_ratio: 0          # see configs/rank/lr.yaml for the Scheme A discussion
  hard_pool_size: 200
  use_recall_features: false
  recall_feature_depth: 500
  valid_ratio: 0.1
  candidate_pool_size: 1000

output:
  top_k_after_rerank: 100

eval:
  k_list: [10, 50, 100]

# @package rank
name: din
stage: fine_rank

model:
  embedding_dim: 32
  attention_hidden: [64, 32]
  attention_activation: dice      # {dice, relu, prelu}
  dnn_hidden: [200, 80]
  dnn_dropout: 0.3
  dnn_activation: dice
  use_bn: true
  l2_reg_embedding: 1e-5
  seq_max_len: 50
  # Ablation switch — set false to degrade to sum pooling
  use_attention: true

train:
  epochs: 10
  batch_size: 1024
  lr: 1e-3
  weight_decay: 0.0
  loss: binary_crossentropy
  optimizer: adam
  early_stopping_patience: 3

input:
  top_k_from_prerank: 100

output:
  top_k_after_rank: 20
  save_attention_weights: true    # for visualization notebook

# @package rank
name: din
stage: fine_rank

model:
  embedding_dim: 32
  attention_hidden: [64, 32]
  dnn_hidden: [200, 80]
  dnn_dropout: 0.3
  use_attention: true              # ablation switch — set false to fall back to sum pooling
  device: cpu

train:
  epochs: 6
  batch_size: 2048
  inference_batch_size: 4096
  lr: 1.0e-3
  weight_decay: 1.0e-5
  grad_clip: 5.0
  early_stopping_patience: 2

input:
  max_genres: 6
  max_seq_len: 50
  negative_ratio: 4
  hard_negative_ratio: 0          # see configs/rank/lr.yaml for the Scheme A discussion
  hard_pool_size: 200
  use_recall_features: false
  recall_feature_depth: 500
  valid_ratio: 0.1
  candidate_pool_size: 1000        # In production DIN sees DeepFM's top-100; here we use
                                   # merge's top-1000 directly so all 4 rankers are
                                   # compared on the same end-to-end task.

output:
  top_k_after_rerank: 100

eval:
  k_list: [10, 50, 100]

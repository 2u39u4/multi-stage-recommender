# @package data
name: movielens_1m
size: "1m"
url: "https://files.grouplens.org/datasets/movielens/ml-1m.zip"

split:
  strategy: leave_one_out       # {leave_one_out, time_based}
  valid_ratio: 0.1              # only for time_based
  test_ratio: 0.1               # only for time_based
  min_interactions_per_user: 5  # drop very cold users from training

# Out-of-fold (OOF) recall vs. ranker split — see docs/W3_SCHEME_A_LESSON.md.
# When `oof_split=true`, recall channels read split=='train_recall' (90% of each
# user's train history, chronologically earlier) and rankers read
# split=='train_ranker' (the remaining 10%, chronologically later). All
# artefacts are written to `artifacts/recall_oof/` and `artifacts/rank_oof/`
# so the W2 full-train numbers in README §7.1 stay reproducible.
oof_split: false
ranker_fraction: 0.10           # only used when oof_split=true

feedback:
  type: implicit                # treat rating >= threshold as positive
  rating_threshold: 4.0

negatives:
  train_ratio: 4                # 1 pos : 4 random negatives for ranking
  eval_sample: 99               # 99 negatives + 1 positive for evaluation

features:
  user_cols: [user_id, age_bucket, gender, occupation]
  item_cols: [item_id, genres, year_bucket]
  sequence:
    max_len: 50
    padding_value: 0

max_user_id: null                # filled in after preprocessing
max_item_id: null

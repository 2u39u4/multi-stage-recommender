[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neorec"
version = "1.0.0"
description = "Production-style multi-stage recommender system on MovieLens."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
authors = [{ name = "Junye Zhao" }]
keywords = [
    "recommender-system",
    "deep-learning",
    "pytorch",
    "faiss",
    "fastapi",
    "mlops",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2,<2.3",
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "implicit>=0.7",
    "faiss-cpu>=1.8",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "mlflow>=2.13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
    "streamlit>=1.35",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "typer>=0.12",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
]

[project.optional-dependencies]
full = [
    "lightfm>=1.17",
    "deepctr-torch>=0.2.9",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbconvert>=7.16",
    "locust>=2.27",
]
tf = [
    "tensorflow>=2.15,<2.17",
]

[project.scripts]
neorec = "neorec.cli:app"

[project.urls]
Homepage = "https://github.com/2u39u4/multi-stage-recommender"
Repository = "https://github.com/2u39u4/multi-stage-recommender"

[tool.hatch.build.targets.wheel]
packages = ["src/neorec"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = [
    "B007",
    "B905",
    "C401",
    "E501",   # line too long handled by formatter
    "N",      # ML code uses conventional names like X, K, F, AUC-shaped helpers
    "RUF001", # README/docs and recsys logs intentionally use symbols like × / σ
    "RUF002",
    "RUF003",
    "RUF005",
    "RUF007",
    "RUF019",
    "RUF022",
    "RUF046",
    "RUF059",
    "RUF100",
    "SIM114",
    "SIM300",
    "UP037",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N803"]
"notebooks/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["src/neorec"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/neorec",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests requiring a GPU",
]

[tool.coverage.run]
source = ["src/neorec"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
